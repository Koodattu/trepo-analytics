[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuni-msc-downloads-counts-scraper"
version = "0.1.0"
description = "Scrape TUNI TREPO recent submissions and analyze download counts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "Flask==3.1.3",
    "openai==3.55.1",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
server = ["gunicorn==27.0.1"]

[project.scripts]
trepo-scraper = "tuni_scraper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuni_scraper = ["templates/*.html", "static/*.css"]

[tool.uv]
required-version = "==0.13.9"
