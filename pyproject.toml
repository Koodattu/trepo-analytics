[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuni-msc-downloads-counts-scraper"
version = "0.1.0"
description = "Scrape TUNI TREPO recent submissions and analyze download counts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "Flask==3.1.3",
    "openai==2.53.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
server = ["gunicorn==26.0.0"]

[project.scripts]
trepo-scraper = "tuni_scraper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuni_scraper = ["templates/*.html"]
